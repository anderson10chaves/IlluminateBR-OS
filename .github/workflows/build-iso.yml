name: Build IlluminateBR-OS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Instalar Dependências do Sistema para Build Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build do Instalador Flutter
        run: |
          cd installer
          flutter pub get
          flutter build linux --release

      - name: Compactar Artefatos da Build
        run: |
          tar -czvf IlluminateBR-OS-Build.tar.gz installer/build/linux/x64/release/bundle/ scripts/

      - name: Criar Release e Fazer Upload do Artefato
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: "IlluminateBR-OS v1.0.0 Stable"
          body: |
            🚀 **Release Oficial do IlluminateBR-OS**

            - Kernel Otimizado CachyOS / Base Arch Linux
            - Interface Cinnamon com visual e efeitos estilo macOS
            - Instalador Flutter com seletor de perfis (Dev, DevOps, Mídia)
            - Otimizações de Ergonomia Visual e Desempenho (zRAM + CPU)
          files: |
            IlluminateBR-OS-Build.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
