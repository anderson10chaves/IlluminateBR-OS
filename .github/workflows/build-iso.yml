name: Build IlluminateBR-OS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Instalar Dependências de Build Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build do Instalador Flutter
        run: |
          cd installer
          flutter pub get
          flutter build linux --release

      - name: Salvar Artefatos do Instalador
        uses: actions/upload-artifact@v4
        with:
          name: installer-bin
          path: installer/build/linux/x64/release/bundle/

  build-iso:
    needs: build-installer
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Instalar archiso e ferramentas
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git

      - name: Preparar Perfil ISO com Xorg e Drivers
        run: |
          cp -r /usr/share/archiso/configs/releng/ /tmp/archiso-profile
          
          # Adiciona pacotes graficos necessarios (usando 'xz' em vez de 'liblzma')
          echo -e "\nxorg-server\nxorg-xinit\nxf86-video-vesa\nopenbox\ngtk3\nxz" >> /tmp/archiso-profile/packages.x86_64

          mkdir -p /tmp/archiso-profile/airootfs/usr/bin/installer/
          mkdir -p /tmp/archiso-profile/airootfs/root/IlluminateBR-OS/

      - name: Baixar Artefato do Instalador Flutter
        uses: actions/download-artifact@v4
        with:
          name: installer-bin
          path: /tmp/archiso-profile/airootfs/usr/bin/installer/

      - name: Injetar Scripts e Autostart do Xorg
        run: |
          cp -r scripts /tmp/archiso-profile/airootfs/root/IlluminateBR-OS/
          chmod +x /tmp/archiso-profile/airootfs/usr/bin/installer/illuminatebr_os

          # Configura o Xorg para disparar o instalador Flutter no boot
          echo "/usr/bin/installer/illuminatebr_os" > /tmp/archiso-profile/airootfs/root/.xinitrc
          echo 'if [ -z "$DISPLAY" ] && [ "$(tty)" = "/dev/tty1" ]; then startx; fi' >> /tmp/archiso-profile/airootfs/root/.bashrc

      - name: Gerar ISO bootável
        run: |
          mkdir -p /tmp/iso-out
          mkarchiso -v -w /tmp/archiso-tmp -o /tmp/iso-out /tmp/archiso-profile/

      - name: Renomear ISO gerada
        run: |
          ISO_FILE=$(find /tmp/iso-out -name "*.iso" | head -n 1)
          if [ -n "$ISO_FILE" ]; then
            mv "$ISO_FILE" /tmp/iso-out/IlluminateBR-OS-v1.0.0-x86_64.iso
          fi

      - name: Upload da ISO para Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: illuminatebr-iso
          path: /tmp/iso-out/IlluminateBR-OS-v1.0.0-x86_64.iso

  release:
    needs: [build-installer, build-iso]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar ISO do Job Anterior
        uses: actions/download-artifact@v4
        with:
          name: illuminatebr-iso

      - name: Criar Release e Fazer Upload da ISO (.iso)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: "IlluminateBR-OS v1.0.0 Stable"
          body: |
            🚀 **Release Oficial do IlluminateBR-OS (Live GUI)**
          files: |
            IlluminateBR-OS-v1.0.0-x86_64.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
