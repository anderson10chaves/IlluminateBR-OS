name: Build IlluminateBR-OS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Arch ISO inside Docker
        run: |
          docker run --privileged -v $(pwd):/workspace -w /workspace archlinux:latest bash -c "
            sed -i 's/#ParallelDownloads = 5/ParallelDownloads = 10/' /etc/pacman.conf &&
            pacman-key --init &&
            pacman-key --populate archlinux &&
            pacman -Syu --noconfirm archiso git squashfs-tools xorriso &&
            cp -r /usr/share/archiso/configs/releng/* /workspace/profile/ 2>/dev/null || true &&
            cp /workspace/profile/packages.x86_64 /workspace/profile/packages.x86_64.custom 2>/dev/null || true &&
            mkarchiso -v -w /tmp/archiso-tmp -o /workspace/out /workspace/profile
          "

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IlluminateBR-OS-ISO
          path: out/*.iso
