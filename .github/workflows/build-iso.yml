name: Build IlluminateBR-OS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Arch ISO inside Docker
        run: |
          docker run --privileged -v $(pwd):/workspace -w /workspace archlinux:latest bash -c "
            pacman-key --init && pacman-key --populate &&
            pacman -Syu --noconfirm archiso git squashfs-tools xorriso &&
            cp /etc/pacman.d/mirrorlist /workspace/profile/mirrorlist 2>/dev/null || true &&
            mkarchiso -v -w /tmp/archiso-tmp -o /workspace/out /workspace/profile
          "

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IlluminateBR-OS-ISO
          path: out/*.iso
