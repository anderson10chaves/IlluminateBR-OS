name: Build IlluminateBR-OS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Instalar Dependências de Build Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build do Instalador Flutter
        run: |
          cd installer
          flutter pub get
          flutter build linux --release

      - name: Salvar Artefatos do Instalador
        uses: actions/upload-artifact@v4
        with:
          name: installer-bin
          path: installer/build/linux/x64/release/bundle/

  build-iso:
    needs: build-installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Instalar Dependências do Debian Live-Build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap systemd-container

      - name: Baixar Artefato do Instalador Flutter
        uses: actions/download-artifact@v4
        with:
          name: installer-bin
          path: iso-builder/config/includes.chroot/usr/bin/installer/

      - name: Gerar ISO bootável (Debian Base)
        run: |
          cd iso-builder
          chmod +x build-iso.sh
          chmod +x config/includes.chroot/usr/bin/installer/illuminatebr_os 2>/dev/null || true
          sudo ./build-iso.sh

      - name: Mover e Renomear ISO Gerada
        run: |
          mkdir -p /tmp/iso-out
          ISO_FILE=$(find iso-builder/ -name "*.iso" | head -n 1)
          if [ -n "$ISO_FILE" ]; then
            mv "$ISO_FILE" /tmp/iso-out/IlluminateBR-OS-v1.0.0-x86_64.iso
          fi

      - name: Upload da ISO para Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: illuminatebr-iso
          path: /tmp/iso-out/IlluminateBR-OS-v1.0.0-x86_64.iso

  release:
    needs: [build-installer, build-iso]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar ISO do Job Anterior
        uses: actions/download-artifact@v4
        with:
          name: illuminatebr-iso

      - name: Criar Release e Fazer Upload da ISO (.iso)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: "IlluminateBR-OS v1.0.0 Stable (Debian)"
          body: |
            🚀 **Release Oficial do IlluminateBR-OS (Debian Bookworm + Calamares)**
          files: |
            IlluminateBR-OS-v1.0.0-x86_64.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
