name: Build IlluminateBR-OS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Instalar Dependências de Build Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build do Instalador Flutter
        run: |
          cd installer
          flutter pub get
          flutter build linux --release

      - name: Salvar Artefatos do Instalador
        uses: actions/upload-artifact@v4
        with:
          name: installer-bin
          path: installer/build/linux/x64/release/bundle/

  build-iso:
    needs: build-installer
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Instalar archiso e ferramentas
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git

      - name: Preparar Perfil ISO com Ambiente Gráfico (GUI Live)
        run: |
          cp -r /usr/share/archiso/configs/releng/ /tmp/archiso-profile
          
          # Adiciona pacotes graficos Xorg, LightDM e dependencias do Flutter no live system
          echo -e "\nxorg-server\nxorg-xinit\nlightdm\nlightdm-gtk-greeter\nopenbox\nnetworkmanager\npolkit\ngtk3\nliblzma" >> /tmp/archiso-profile/packages.x86_64

          # Prepara pastas do sistema live
          mkdir -p /tmp/archiso-profile/airootfs/usr/bin/installer/
          mkdir -p /tmp/archiso-profile/airootfs/etc/autostart/
          mkdir -p /tmp/archiso-profile/airootfs/root/IlluminateBR-OS/

      - name: Baixar Artefato do Instalador Flutter
        uses: actions/download-artifact@v4
        with:
          name: installer-bin
          path: /tmp/archiso-profile/airootfs/usr/bin/installer/

      - name: Injetar Scripts e Autostart Gráfico
        run: |
          cp -r scripts /tmp/archiso-profile/airootfs/root/IlluminateBR-OS/
          
          # Garante permissao de execucao no binario Flutter
          chmod +x /tmp/archiso-profile/airootfs/usr/bin/installer/illuminatebr_os

          # Cria atalho desktop de autostart grafico
          cat << 'DESKTOP' > /tmp/archiso-profile/airootfs/etc/xdg/autostart/illuminatebr-installer.desktop
[Desktop Entry]
Type=Application
Name=IlluminateBR-OS Installer
Exec=/usr/bin/installer/illuminatebr_os
Icon=system-software-install
Terminal=false
Categories=System;
DESKTOP

          # Habilita entrada automatica no Xorg ao dar boot no live mode
          echo "exec openbox-session" > /tmp/archiso-profile/airootfs/root/.xinitrc
          echo "if [ -z \"\$DISPLAY\" ] && [ \"\$(tty)\" = \"/dev/tty1\" ]; then startx; fi" >> /tmp/archiso-profile/airootfs/root/.bashrc

      - name: Gerar ISO bootável
        run: |
          mkdir -p /tmp/iso-out
          mkarchiso -v -w /tmp/archiso-tmp -o /tmp/iso-out /tmp/archiso-profile/

      - name: Renomear ISO gerada
        run: |
          mv /tmp/iso-out/*.iso /tmp/iso-out/IlluminateBR-OS-v1.0.0-x86_64.iso

      - name: Upload da ISO para Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: illuminatebr-iso
          path: /tmp/iso-out/IlluminateBR-OS-v1.0.0-x86_64.iso

  release:
    needs: [build-installer, build-iso]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar ISO do Job Anterior
        uses: actions/download-artifact@v4
        with:
          name: illuminatebr-iso

      - name: Criar Release e Fazer Upload da ISO (.iso)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0
          name: "IlluminateBR-OS v1.0.0 Stable"
          body: |
            🚀 **Release Oficial do IlluminateBR-OS (Live GUI)**

            - Kernel Otimizado / Base Arch Linux
            - Boot Live 100% Gráfico com instalador automático
            - Interface Cinnamon com visual e efeitos estilo macOS
            - Instalador Flutter com seletor de perfis (Dev, DevOps, Mídia)
            - Otimizações de Ergonomia Visual e Desempenho (zRAM + CPU)
          files: |
            IlluminateBR-OS-v1.0.0-x86_64.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
